# iOS app: keeps the Xcode project (ios/QuranMasterclass.xcodeproj) in git up to date with ios/project.yml
# and checks that the app compiles (simulator build, no signing). Publishing is done on a Mac: scripts/build-ios.sh
name: iOS app
on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Commit the Xcode project if it changed
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git add -A ios/QuranMasterclass.xcodeproj
          if git diff --cached --quiet; then echo "Xcode project unchanged"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "iOS: regenerate the Xcode project from ios/project.yml"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Build for the simulator
        working-directory: ios
        run: |
          xcodebuild -version
          xcodebuild -project QuranMasterclass.xcodeproj -scheme QuranMasterclass -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|warning: .*Swift|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
